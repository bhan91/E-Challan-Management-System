<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Check Your Challan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
        }
        .logo {
            width: 100px;
            height: auto;
            margin: 0 auto 10px;
            display: block;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 20px;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #3498db;
            color: #fff;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #2980b9;
        }
        a {
            display: inline-block;
            margin-top: 15px;
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
       <img src="{{ url_for('static', filename='karnataka_logo.png') }}"  style="height:80px;">
        
        <h1>Karnataka State Police</h1>
        <h2>Check Your Challan</h2>
        
        <form action="/search" method="post">
            <input type="text" name="reg_no" placeholder="Enter Vehicle Number" required>
            <button type="submit">Search</button>
        </form>
        
        <a href="/police">Police Login</a>
    </div>

</body>
</html>
